name: Tests

# Kab chalana hai: main branch pe push hone pe, aur PR banne pe
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Aapka code GitHub ke computer pe download karo
      - uses: actions/checkout@v4

      # 2. Node.js install karo
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. package.json ki dependencies install karo
      - name: Install dependencies
        run: npm ci

      # 4. Playwright ke liye browser install karo
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # 5. Postman / Newman API tests chalao
      - name: Run API tests
        run: npm test

      # 6. Playwright UI tests chalao (sirf improved wale, sirf chromium pe)
      - name: Run Playwright tests
        run: npx playwright test tests/improved tests/saucedemo.spec.ts --project=chromium

      # 7. HTML report save karo (test fail ho tab bhi)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
