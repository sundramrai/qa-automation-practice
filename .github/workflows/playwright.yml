name: Tests

# Runs on every push to main and on every pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Check out the code
      - uses: actions/checkout@v4

      # 2. Install Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Install dependencies from package.json
      - name: Install dependencies
        run: npm ci

      # 4. Install the Chromium browser for Playwright
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # 5. Run the Postman / Newman API tests
      - name: Run API tests
        run: npm test

      # 6. Run the Playwright UI tests in tests/ on Chromium
      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      # 7. Save the HTML report (even when tests fail)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

